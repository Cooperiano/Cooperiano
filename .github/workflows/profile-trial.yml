name: Trial profile card generation

on:
  push:
    branches: [trial/profile-actions-20261008]
    paths:
      - 'scripts/update_profile.py'
      - '.github/workflows/profile-trial.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate public profile cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py
      - name: Check generated SVGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          images = list(Path('assets').glob('*.svg'))
          assert len(images) == 6
          for image in images:
              ET.parse(image)
          print('Validated all six generated SVGs.')
          PY
      - name: Save images and public data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-cards-trial
          path: assets/
          if-no-files-found: error
          retention-days: 7
