name: Refresh public profile cards

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/profile.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile.yml'

permissions:
  contents: read

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate images and README asset references
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          images = list(Path('assets').glob('*.svg'))
          expected = {f'{name}-{theme}.svg' for name in ('hero', 'inktyper', 'touchpad', 'academy', 'stack', 'activity', 'footer') for theme in ('light', 'dark')}
          assert {image.name for image in images} == expected, 'Missing or unexpected theme images'
          for image in images:
              ET.parse(image)
          readme = Path('README.md').read_text(encoding='utf-8')
          references = re.findall(r'(?:src|srcset)="(\./[^"]+)"', readme)
          assert len(references) == len(expected), 'Expected both themes for each artwork'
          assert all(Path(reference).is_file() for reference in references)
          assert {Path(reference).name for reference in references} == expected
          print('Validated all theme SVGs and README image references.')
          PY
      - name: Verify generation from saved public data
        run: python3 scripts/update_profile.py --snapshot assets/public-stats.json
  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate public-only cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh public profile cards'
          git push
